apiVersion: v1
kind: Namespace
metadata:
  name: cloudshop
  labels:
    app.kubernetes.io/part-of: cloudshop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: product-service-config
  namespace: cloudshop
data:
  LOG_LEVEL: "info"
  PRODUCT_CACHE_TTL_SECONDS: "60"
---
apiVersion: v1
kind: Secret
metadata:
  name: product-service-secret
  namespace: cloudshop
type: Opaque
stringData:
  DATABASE_DSN: "replace-before-use"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: cloudshop
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: cloudshop
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: product-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-service
        app.kubernetes.io/part-of: cloudshop
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: product-service
          image: example.invalid/cloudshop/product-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: product-service-config
            - secretRef:
                name: product-service-secret
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: cloudshop
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: cloudshop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: product-service
  ports:
    - name: http
      port: 80
      targetPort: http

