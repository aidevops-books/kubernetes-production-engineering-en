apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: cloudshop
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: product-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-service
        app.kubernetes.io/part-of: cloudshop
    spec:
      containers:
        - name: product-service
          image: example.invalid/cloudshop/product-service:1.0.0
          ports:
            - name: http
              containerPort: 8080

