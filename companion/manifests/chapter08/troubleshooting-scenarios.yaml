apiVersion: v1
kind: Namespace
metadata:
  name: cloudshop-troubleshooting
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-pod-scenario
  namespace: cloudshop-troubleshooting
  annotations:
    cloudshop.example.com/scenario: "Pod remains Pending because no node has this label."
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pending-pod-scenario
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pending-pod-scenario
    spec:
      nodeSelector:
        cloudshop.example.com/nonexistent-node-pool: "true"
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-pull-scenario
  namespace: cloudshop-troubleshooting
  annotations:
    cloudshop.example.com/scenario: "Pod reaches ImagePullBackOff because the image reference is invalid."
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: image-pull-scenario
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-pull-scenario
    spec:
      containers:
        - name: app
          image: example.invalid/cloudshop/missing:does-not-exist
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-failure-scenario
  namespace: cloudshop-troubleshooting
  annotations:
    cloudshop.example.com/scenario: "Readiness points to a path this container never serves."
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: probe-failure-scenario
  template:
    metadata:
      labels:
        app.kubernetes.io/name: probe-failure-scenario
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=ok"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-scenario
  namespace: cloudshop-troubleshooting
  annotations:
    cloudshop.example.com/scenario: "Container exits immediately on startup, producing CrashLoopBackOff."
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crashloop-scenario
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crashloop-scenario
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo 'simulated fatal startup error' >&2; exit 1"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-scenario
  namespace: cloudshop-troubleshooting
  annotations:
    cloudshop.example.com/scenario: "Container allocates more memory than its limit allows and is OOMKilled."
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oom-scenario
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oom-scenario
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          command: ["python3", "-c", "data = bytearray(64 * 1024 * 1024); import time; time.sleep(3600)"]
          resources:
            limits:
              memory: 16Mi

