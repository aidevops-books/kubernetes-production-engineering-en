apiVersion: v1
kind: Namespace
metadata:
  name: cloudshop-data
  labels:
    app.kubernetes.io/part-of: cloudshop
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: cloudshop-data
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: cloudshop
    spec:
      containers:
        - name: redis
          image: redis:7.2
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cloudshop-data
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recovery-check
  namespace: cloudshop-data
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: recovery-check
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - echo "Run provider-specific backup verification here."

