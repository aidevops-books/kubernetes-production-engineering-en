apiVersion: v1
kind: Namespace
metadata:
  name: cloudshop-production
  labels:
    environment: production
    owner: platform-team
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: production-quota
  namespace: cloudshop-production
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.memory: 80Gi
    pods: "100"
    services: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workload-defaults
  namespace: cloudshop-production
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 8Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: production-readiness-baseline
  namespace: cloudshop-production
data:
  checklist.yaml: |
    workload_lifecycle: reviewed
    resource_sizing: evidence_based
    topology: failure_domain_aware
    traffic: gateway_owned
    identity: workload_scoped
    rbac: least_privilege
    pod_security: restricted
    network_policy: default_deny_with_required_flows
    observability: slo_aligned
    delivery: gitops_reconciled
    recovery: tested
    upgrades: compatibility_reviewed

