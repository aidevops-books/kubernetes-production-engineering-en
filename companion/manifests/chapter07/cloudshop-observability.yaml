apiVersion: v1
kind: Namespace
metadata:
  name: cloudshop-observability
  labels:
    app.kubernetes.io/part-of: cloudshop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudshop-slo-policy
  namespace: cloudshop-observability
data:
  slo.yaml: |
    service: order-service
    sli: successful_http_requests
    objective: 99.9
    window: 30d
    owner: order-platform-team
    page_when: error_budget_burn_is_actionable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: cloudshop-observability
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: order-service
          image: example.invalid/cloudshop/order-service:1.0.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: order-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4317
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: cloudshop-observability
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: /metrics
spec:
  selector:
    app.kubernetes.io/name: order-service
  ports:
    - name: http
      port: 80
      targetPort: 8080

